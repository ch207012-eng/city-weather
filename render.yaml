services:
  - type: web
    name: city-weather-dashboard
    env: python
    plan: free
    rootDir: consumer_dashboard
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:server --bind 0.0.0.0:${PORT}
    envVars:
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false

  - type: worker
    name: city-weather-producer
    env: python
    plan: free
    rootDir: producer
    buildCommand: pip install -r requirements.txt
    startCommand: python producer.py
    envVars:
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: POLL_INTERVAL_SECONDS
        value: "300"
